name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests cover the pure logic, so only the light dependencies are needed.
      - run: pip install pytest python-pptx pypdf python-docx certifi
      - run: python -m pytest -q

  # Installs the full app on real Windows and macOS machines and imports every
  # module, so platform-specific breakage shows up without a local Windows PC.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the chatbot engine (prebuilt CPU wheel on Windows)
        if: runner.os == 'Windows'
        run: pip install --prefer-binary "llama-cpp-python>=0.3.2" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Import every module
        run: >
          python -c "import packages.frontend, packages.vision, packages.hands, packages.gesture,
          packages.virtual_mouse, packages.library, packages.chatbot, packages.local_llm, packages.system;
          from packages.local_llm import runtime_available; assert runtime_available(); print('imports ok')"
      - run: python -m pytest -q
