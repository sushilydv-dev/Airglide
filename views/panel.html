<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Airglide</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="app.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background: var(--surface); }
        body::before, body::after { display: none !important; }
        .wrap { height: 100%; display: flex; flex-direction: column; padding: 0.8rem 0.9rem 0.9rem; gap: 0.7rem; box-sizing: border-box; }
        header { display: flex; align-items: center; gap: 0.55rem; cursor: grab; }
        header .mark { width: 1.9rem; height: 1.9rem; border-radius: 9px; display: grid; place-items: center;
                       background: #fff; color: var(--primary); box-shadow: inset 0 0 0 1px var(--border); }
        header .mark svg { width: 1.25rem; height: 1.25rem; }
        header strong { font-size: 0.98rem; letter-spacing: -0.01em; }
        header .chip { height: 1.55rem; font-size: 0.72rem; }
        header .close { margin-left: auto; width: 1.9rem; height: 1.9rem; border-radius: 10px; }
        header .close svg { width: 1rem; height: 1rem; }

        .cam { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-sm); overflow: hidden;
               background: var(--surface-3); flex: none; }
        .cam img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .cam.live img { display: block; }
        .cam .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 0.55rem; color: var(--text-2); font-size: 0.82rem; text-align: center; padding: 1rem; }
        .cam.live .ph { display: none; }
        .cam .badge { position: absolute; left: 0.5rem; right: 0.5rem; bottom: 0.5rem; display: none; gap: 0.4rem;
                      align-items: center; padding: 0.35rem 0.6rem; border-radius: 10px; font-size: 0.76rem;
                      background: rgba(10, 14, 24, 0.62); color: #fff; backdrop-filter: blur(6px); }
        .cam.live .badge { display: flex; }
        .cam .badge .act { margin-left: auto; font-weight: 600; color: #9cc0ff; }
        .cam .off { position: absolute; top: 0.45rem; right: 0.45rem; display: none; height: 1.8rem; padding: 0 0.6rem;
                    font-size: 0.72rem; border-radius: 9px; }
        .cam.live .off { display: inline-flex; }

        .tabs { display: flex; gap: 0.25rem; padding: 0.22rem; background: var(--surface-3); border-radius: 12px; flex: none; }
        .tabs button { flex: 1; height: 1.9rem; border: 0; border-radius: 9px; background: transparent; color: var(--text-2);
                       font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

        .pane { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
        .pane[hidden] { display: none; }
        .deckname { font-size: 0.78rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
        .ctl .btn { height: 2.5rem; font-size: 0.8rem; border-radius: 12px; justify-content: center; }
        .ctl .wide { grid-column: span 2; }
        .keys { margin-top: 0.2rem; display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.7rem; font-size: 0.74rem; color: var(--text-2); }
        .keys kbd { font: inherit; font-weight: 600; color: var(--text); }

        h3 { margin: 0.25rem 0 0; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
        .g { display: flex; align-items: center; gap: 0.6rem; padding: 0.42rem 0.6rem; border-radius: 10px;
             background: var(--surface-2); font-size: 0.8rem; transition: background 0.15s, box-shadow 0.15s; }
        .g .a { margin-left: auto; color: var(--text-2); text-align: right; }
        .g.live { background: var(--primary-soft); box-shadow: inset 0 0 0 1.5px var(--primary); }
        .g.live .a { color: var(--primary); font-weight: 600; }
        .note { font-size: 0.72rem; color: var(--text-3); margin: 0.1rem 0.2rem 0; }
    </style>
</head>
<body>
<div class="wrap">
    <header class="pywebview-drag-region">
        <span class="mark" id="mark" aria-hidden="true"></span>
        <strong>Airglide</strong>
        <span class="chip" id="status">Idle</span>
        <button class="btn ghost icon close" id="close" title="Close" aria-label="Close"></button>
    </header>

    <div class="cam" id="cam">
        <img id="frame" alt="Camera view">
        <div class="ph"><span id="ph-text">Camera is off</span><button class="btn soft sm" id="cam-on"></button></div>
        <div class="badge"><span id="pose">Show your hand</span><span class="act" id="act"></span></div>
        <button class="btn sm off" id="cam-off">Hide</button>
    </div>

    <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="controls">Controls</button>
        <button role="tab" aria-selected="false" data-tab="gestures">Gestures</button>
    </div>

    <div class="pane" id="pane-controls" role="tabpanel">
        <div class="deckname" id="deck"></div>
        <div class="ctl">
            <button class="btn primary wide" id="present"></button>
            <button class="btn" id="mouse"></button>
            <button class="btn" id="pause"></button>
            <button class="btn ghost wide" id="main"></button>
        </div>
        <div class="keys" id="keys"></div>
    </div>

    <div class="pane" id="pane-gestures" role="tabpanel" hidden>
        <h3>Presenter</h3>
        <div id="g-presenter"></div>
        <h3>Virtual mouse</h3>
        <div id="g-mouse"></div>
        <p class="note">Hold a gesture steady for a moment. Change them in Airglide → Settings.</p>
    </div>
</div>
<script src="icons.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const api = () => window.pywebview.api;
let S = null;

const MOUSE_GESTURES = [
    ["☝️ Index only", "Move the cursor"],
    ["✌️ Index + middle, pinched", "Click"],
    ["Three fingers up", "Scroll (move hand up / down)"],
    ["👆 L-shape, held still", "Pause / resume"],
];
const HOTKEY_LABELS = { presenter: "Presenter on / off", mouse: "Virtual mouse on / off", pause: "Pause / resume", show: "Show Airglide" };

const ag = {
    handlers: {},
    on(kind, fn) { (this.handlers[kind] = this.handlers[kind] || []).push(fn); },
    emit(kind, payload) { for (const fn of this.handlers[kind] || []) { try { fn(payload); } catch (e) { console.error(e); } } },
};
window.ag = ag;

function withIcon(el, name, text) {
    el.replaceChildren(icon(name), document.createTextNode(text));
}

function row(left, right, pose) {
    const r = document.createElement("div");
    r.className = "g";
    if (pose) r.dataset.pose = pose;
    const l = document.createElement("span"); l.textContent = left;
    const a = document.createElement("span"); a.className = "a"; a.textContent = right;
    r.append(l, a);
    return r;
}

function render(s) {
    S = s;
    const p = s.presenter, m = s.mouse;
    const status = $("status");
    const label = p.running ? (p.paused ? "Presenter paused" : "Presenting") : m.running ? (m.paused ? "Mouse paused" : "Mouse on") : "Idle";
    status.textContent = label;
    status.className = "chip " + (s.active === "on" ? "green" : s.active === "paused" ? "amber" : "");

    $("deck").textContent = s.presentation
        ? (p.running && p.total ? `${s.presentation} · slide ${p.slide} / ${p.total}` : s.presentation)
        : "No presentation loaded: add one in Airglide";
    withIcon($("present"), p.running ? "stop" : "play", p.running ? "Stop presenting" : "Start presenting");
    $("present").className = "btn wide " + (p.running ? "danger" : "primary");
    $("present").disabled = !p.running && !s.presentation;
    withIcon($("mouse"), "mouse", m.running ? "Mouse off" : "Virtual mouse");
    $("mouse").className = "btn " + (m.running ? "soft" : "");
    const paused = p.running ? p.paused : m.paused;
    withIcon($("pause"), paused ? "play" : "pause", paused ? "Resume" : "Pause");
    $("pause").disabled = !p.running && !m.running;
    withIcon($("main"), "home", "Open Airglide");

    const keys = $("keys");
    keys.replaceChildren();
    for (const k of s.hotkeys) {
        const kb = document.createElement("kbd"); kb.textContent = k.keys;
        const t = document.createElement("span"); t.textContent = HOTKEY_LABELS[k.action] || k.action;
        keys.append(kb, t);
    }

    const gp = $("g-presenter");
    gp.replaceChildren(...s.gestures.map((g) => row(g.label, g.action, g.pose)));
    if (s.two_hand_zoom) gp.append(row("☝️☝️ Both index fingers", "Zoom (apart / together)"));
    $("g-mouse").replaceChildren(...MOUSE_GESTURES.map(([l, a]) => row(l, a)));
    for (const el of document.querySelectorAll("#g-presenter .g, #g-mouse .g")) el.style.marginBottom = ".3rem";

    setCamera(s.camera, false);
}

function setCamera(on, tell = true) {
    const cam = $("cam");
    if (!on) { cam.classList.remove("live"); $("ph-text").textContent = "Camera is off"; }
    else if (!cam.classList.contains("live")) $("ph-text").textContent = "Starting camera…";
    $("cam-on").hidden = !!on;
    if (tell) api().set_camera(!!on);
}

async function refresh() { render(await api().get_state()); }

ag.on("changed", refresh);
ag.on("presenter", refresh);
ag.on("frame", (f) => {
    const cam = $("cam");
    if (f.error) { cam.classList.remove("live"); $("ph-text").textContent = f.error; return; }
    cam.classList.add("live");
    $("frame").src = "data:image/jpeg;base64," + f.img;
    $("pose").textContent = f.hands ? (f.pose_label || "Hand detected") : "Show your hand";
    $("act").textContent = f.action ? `→ ${f.action}` : "";
    for (const r of document.querySelectorAll("#g-presenter .g")) r.classList.toggle("live", !!f.pose && r.dataset.pose === f.pose);
});

function applyAppearance(a) {
    if (!a) return;
    const dark = a.theme === "dark" || (a.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.contrast = a.high_contrast ? "high" : "normal";
}
window.applyAppearance = applyAppearance;

for (const t of document.querySelectorAll("[data-tab]")) {
    t.onclick = () => {
        for (const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-selected", String(b === t));
        $("pane-controls").hidden = t.dataset.tab !== "controls";
        $("pane-gestures").hidden = t.dataset.tab !== "gestures";
    };
}

window.addEventListener("pywebviewready", async () => {
    $("mark").innerHTML = BRAND_SVG; // static, trusted markup
    $("close").replaceChildren(icon("x"));
    withIcon($("cam-on"), "camera", "Turn on camera");
    $("close").onclick = () => api().close();
    $("cam-on").onclick = () => setCamera(true);
    $("cam-off").onclick = () => setCamera(false);
    $("present").onclick = async () => { await api().toggle_presenter(); refresh(); };
    $("mouse").onclick = async () => { await api().toggle_mouse(); refresh(); };
    $("pause").onclick = async () => { await api().toggle_pause(); refresh(); };
    $("main").onclick = () => api().show_main();
    applyAppearance(await api().appearance());
    await refresh();
    if (!S.camera) setCamera(true); // opening the panel shows the camera straight away
});
</script>
</body>
</html>
